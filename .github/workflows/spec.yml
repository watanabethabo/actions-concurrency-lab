name: spec
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 機器規格
        shell: bash
        run: |
          echo "SPEC os=${{ matrix.os }} RUNNER_OS=$RUNNER_OS ARCH=$RUNNER_ARCH"
          echo "SPEC nproc=$(nproc 2>/dev/null || echo $NUMBER_OF_PROCESSORS) NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
          echo "SPEC mem=$(free -h 2>/dev/null | awk '/Mem:/{print $2}' || echo 'n/a')"
          echo "SPEC cpu=$(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | sed 's/^ //' || echo 'n/a')"
